# 数据路径
data:
  train_dir: "dataset/train"
  test_dir: "dataset/test"
  classes_file: "dataset/classes.txt"

# 通用PyTorch模型参数
model:
  hidden_sizes: [512, 256, 128, 64]  # 神经网络隐藏层大小
  dropout_rate: 0.3
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  num_epochs: 20
  early_stopping:
    patience: 5
    min_delta: 0.001
  lr_scheduler:
    factor: 0.5
    patience: 2
    min_lr: 0.000001
  unfreeze_layers: 2

# 保存模型
output:
  model_path: "models/pytorch_model.pkl"
  model_dir: "models"
  results_dir: "results"