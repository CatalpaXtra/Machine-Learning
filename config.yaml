# 数据路径
data:
  train_dir: "dataset/train"
  test_dir: "dataset/test"
  classes_file: "dataset/classes.txt"

# 降维参数
dimensionality_reduction:
  use: true
  method: "pca"
  n_components: 300

# 特征提取
features:
  method: "cnn"
  size: [224, 224]  # 调整图像大小
  cnn_type: "vgg16"

vgg16:
  features:
    method: "cnn"
    size: [224, 224]
    cnn_type: "vgg16"
  output:
    model_path: "models/svm_vgg16.pkl"
    feature_extractor_path: "models/feature_extractor_vgg16.pkl"
    results_dir: "results/vgg16"
  
# 通用SVM模型参数
model:
  kernel: "rbf"  # 使用RBF核函数，通常比线性核函数效果更好
  C: 10.0  # 增加C值，允许更复杂的决策边界
  gamma: "scale"  # 自动缩放gamma值
  probability: true
  class_weight: "balanced"  # 处理类别不平衡
  verbose: false
  cache_size: 4000  # 增加缓存大小
  max_iter: 1000  # 增加最大迭代次数
  tol: 0.001  # 提高精度
  
# 保存模型
output:
  model_path: "models/svm_model.pkl"
  feature_extractor_path: "models/feature_extractor.pkl"
  results_dir: "results"